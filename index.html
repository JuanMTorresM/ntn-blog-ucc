<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Blog académico digital sobre Non-Terrestrial Networks para el Reto ABET SO7 de Comunicaciones II.">
  <meta name="theme-color" content="#07111f">
  <title>Non-Terrestrial Networks (NTN) | Reto ABET SO7</title>
  <link rel="icon" href="assets/images/icons/orbit.svg" type="image/svg+xml">
  <link rel="preload" href="assets/images/hero/hero-ntn.svg" as="image">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#appContent">Saltar al contenido</a>
  <div class="site-bg" aria-hidden="true">
    <span class="orb orb-a"></span>
    <span class="orb orb-b"></span>
    <span class="grid-glow"></span>
  </div>

  <header class="topbar">
    <button class="brand" type="button" data-tab-target="inicio" aria-label="Ir a inicio">
      <img src="assets/images/icons/orbit.svg" alt="" class="brand-icon">
      <span>
        <strong>NTN BlogDPC</strong>
        <small>Comunicaciones II - SO7</small>
      </span>
    </button>

    <button id="menuToggle" class="menu-toggle" type="button" aria-expanded="false" aria-controls="mainNav">
      <span></span><span></span><span></span>
      <span class="sr-only">Abrir menú</span>
    </button>

    <nav id="mainNav" class="main-nav" aria-label="Pestañas principales"></nav>
  </header>

  <main id="appContent" class="app-shell" tabindex="-1">
    <section id="inicio" class="tab-panel active" aria-labelledby="tab-inicio"></section>
    <section id="tema" class="tab-panel" aria-labelledby="tab-tema"></section>
    <section id="equipo" class="tab-panel" aria-labelledby="tab-equipo"></section>
    <section id="metodologia" class="tab-panel" aria-labelledby="tab-metodologia"></section>
    <section id="mapa" class="tab-panel" aria-labelledby="tab-mapa"></section>
    <section id="clusters" class="tab-panel" aria-labelledby="tab-clusters"></section>
    <section id="palabras" class="tab-panel" aria-labelledby="tab-palabras"></section>
    <section id="mini-caso" class="tab-panel" aria-labelledby="tab-mini-caso"></section>
    <section id="reflexion" class="tab-panel" aria-labelledby="tab-reflexion"></section>
    <section id="fuentes" class="tab-panel" aria-labelledby="tab-fuentes"></section>
    <section id="asistente" class="tab-panel" aria-labelledby="tab-asistente"></section>
  </main>

  <button id="assistantFloat" class="assistant-float" type="button" aria-label="Abrir asistente IA local">
    <span>IA</span>
  </button>

  <aside id="assistantPanel" class="assistant-panel" aria-label="Asistente IA local" aria-hidden="true">
    <div class="assistant-header">
      <div>
        <strong>Asistente NTN</strong>
        <small>Asistente local del proyecto</small>
      </div>
      <div class="assistant-actions">
        <button id="assistantMinimize" type="button" title="Minimizar">-</button>
        <button id="assistantClose" type="button" title="Cerrar">×</button>
      </div>
    </div>
    <div id="assistantMessages" class="assistant-messages" aria-live="polite"></div>
    <div id="assistantQuick" class="assistant-quick"></div>
    <form id="assistantForm" class="assistant-form">
      <input id="assistantInput" type="text" autocomplete="off" placeholder="Escribe: hola, LEO, Doppler, mapa, mini-caso..." aria-label="Pregunta al asistente">
      <button type="submit">Enviar</button>
    </form>
  </aside>

  <script src="site-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
